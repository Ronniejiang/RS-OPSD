# GeoEvidence only: plain Student, bbox full + derived + tight Teacher.
# Preserve the three-view loader/context budget and the existing top-64 JSD.
defaults:
  - rs_opsd_direct_2k_three_image_kl
  - _self_

actor_rollout_ref:
  actor:
    self_distillation:
      full_logit_distillation: true
      distillation_topk: 64
      distillation_add_tail: true
      alpha: 0.5
      pa_opd_topk_jsd_enabled: true
      pa_opd_topk_jsd_coef: 1.0

data:
  pa_opd_student_image_mode: images
  pa_opd_teacher_full_image_mode: bbox_images
  pa_opd_separate_teacher_views: true

trainer:
  group_name: rs-opsd-direct-2k-three-image-topk64-jsd-kl
  experiment_name: ${oc.env:PA_OPD_RUN_NAME,rs-opsd-direct-2k-three-image-topk64-jsd-kl}
  default_local_dir: ${oc.env:PA_OPD_WORK_DIR,outputs/rs-opsd-direct-2k-three-image-topk64-jsd-kl}/checkpoints
  rollout_data_dir: ${oc.env:PA_OPD_WORK_DIR,outputs/rs-opsd-direct-2k-three-image-topk64-jsd-kl}/rollouts
  resume_mode: disable
  resume_from_path: null
