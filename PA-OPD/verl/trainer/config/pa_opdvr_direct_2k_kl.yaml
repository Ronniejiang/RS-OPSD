# Original 2K direct PA-OPDVR with a frozen-reference KL regularizer ablation.
defaults:
  - ppo_trainer
  - user
  - _self_

hydra:
  job:
    chdir: false
  output_subdir: null

max_model_len: 10240

actor_rollout_ref:
  model:
    path: ${oc.env:PA_OPD_MODEL_PATH,''}
    trust_remote_code: true
    override_config:
      attn_implementation: sdpa
    use_remove_padding: false
    enable_gradient_checkpointing: true
    # Use Qwen3-VL's stock no-thinking template; do not prefill <think>.
    custom_chat_template_file: null

  actor:
    ppo_mini_batch_size: 32
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 10240
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    # Native actor loss: OPDVR policy gradient + low-variance KL to frozen ref.
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    calculate_entropy: false
    optim:
      lr: 2.0e-6
      lr_warmup_steps: 10
    fsdp_config:
      param_offload: true
      optimizer_offload: true
    policy_loss:
      loss_mode: vopd
    self_distillation:
      full_logit_distillation: false
      distillation_topk: null
      alpha: 1.0
      is_clip: 2.0
      max_reprompt_len: 10240
      dont_reprompt_on_self_success: true
      include_environment_feedback: false
      teacher_always_on: true
      # Keep the original EMA privileged Teacher distinct from the frozen KL
      # reference policy. The Teacher starts from the same base checkpoint.
      teacher_model_source: fixed
      teacher_model_path: ${actor_rollout_ref.model.path}
      fixed_teacher_ema: true
      teacher_regularization: ema
      teacher_update_rate: 0.05
      teacher_image_key: bbox_images
      teacher_input_mode: global_plus_crop
      contrastive_visual_advantage: false
      pa_opd_enabled: true
      pa_opd_direct_answer: true
      # This opt-in is the only PA-OPD mode with no reward/GRPO recovery.
      pa_opd_reward_free: true

  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

  rollout:
    name: vllm
    n: 1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.7
    log_prob_micro_batch_size_per_gpu: 1
    max_num_batched_tokens: 10240
    max_model_len: 10240
    response_length: 16
    calculate_log_probs: true
    agent:
      num_workers: 4
    engine_kwargs:
      vllm:
        compilation_config:
          pass_config:
            fuse_allreduce_rms: false
        kernel_config:
          enable_flashinfer_autotune: false

data:
  train_files:
    - ${oc.env:PA_OPD_TRAIN_FILE,''}
  val_files: []
  filter_overlong_prompts: false
  max_prompt_length: 8192
  max_response_length: 16
  truncation: error
  shuffle: true
  trust_remote_code: true
  return_multi_modal_inputs: true
  image_key: images
  pa_opd_direct_jsonl: true
  train_batch_size: 32
  dataloader_num_workers: 8
  apply_chat_template_kwargs:
    enable_thinking: false
    pa_opd_direct_answer: true

# Selects main_pa_opd_direct hooks; deliberately no pa_opd_runtime controller.
pa_opd_direct: true

algorithm:
  # Reward-free direct path skips reward advantages. With actor.use_kl_loss=true,
  # actor loss is compute_opdvr_loss + 1e-3 * low_var_kl(current || frozen ref).
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

critic:
  model:
    path: ${actor_rollout_ref.model.path}

reward_model:
  enable: false
  use_reward_loop: false

custom_reward_function:
  path: null
  name: compute_score

trainer:
  project_name: pa-opd
  group_name: pa-opdvr-direct-2k-kl
  experiment_name: ${oc.env:PA_OPD_RUN_NAME,pa-opdvr-direct-2k-kl1e-3-4gpu}
  logger: [console, wandb]
  n_gpus_per_node: ${oc.env:PA_OPD_NUM_GPUS,4}
  nnodes: 1
  save_freq: 10
  skip_checkpoint: false
  test_freq: -1
  max_actor_ckpt_to_keep: 2
  resume_mode: auto
  resume_from_path: null
  # Preserve mid-epoch ordering by default. Cross-epoch continuation may
  # override this to false when the saved cursor ends on a drop_last boundary.
  resume_dataloader_state: true
  total_epochs: 1
  val_before_train: false
  default_local_dir: ${oc.env:PA_OPD_WORK_DIR,outputs/pa-opdvr-direct-2k-kl1e-3-4gpu}/checkpoints
  rollout_data_dir: ${oc.env:PA_OPD_WORK_DIR,outputs/pa-opdvr-direct-2k-kl1e-3-4gpu}/rollouts
