# 2K direct OPDVR+KL with a full/derived/tight three-image privileged Teacher.
# A 2048px Qwen3-VL image can occupy 16,384 visual positions in verl's
# unmerged sequence. Student/ref therefore need room for that image plus the
# direct-answer response. The privileged Teacher consumes three such images,
# so its independent re-prompt ceiling must accommodate all three views.
defaults:
  - pa_opdvr_direct_2k_kl
  - _self_

# 24,576 prompt positions + 16 direct-answer positions, with a small safety
# margin. This prevents dynamic ref batching from rejecting 16,400-token
# full-image examples.
max_model_len: 25088

actor_rollout_ref:
  actor:
    ppo_max_token_len_per_gpu: 25088
    self_distillation:
      # Three 2048px views can take 3 * 16,384 visual positions before text.
      # This limit applies only to the no-grad privileged-Teacher re-prompt.
      max_reprompt_len: 65536
      teacher_image_key: teacher_images
      teacher_input_mode: global_plus_derived_plus_crop

  rollout:
    max_num_batched_tokens: 25088
    max_model_len: 25088

data:
  pa_opd_direct_jsonl: false
  pa_opd_direct_three_image_jsonl: true
  max_prompt_length: 24576

trainer:
  group_name: pa-opdvr-direct-2k-three-image-kl
  experiment_name: ${oc.env:PA_OPD_RUN_NAME,pa-opdvr-direct-2k-three-image-kl}
  n_gpus_per_node: ${oc.env:PA_OPD_NUM_GPUS,4}
  default_local_dir: ${oc.env:PA_OPD_WORK_DIR,outputs/pa-opdvr-direct-2k-three-image-kl}/checkpoints
  rollout_data_dir: ${oc.env:PA_OPD_WORK_DIR,outputs/pa-opdvr-direct-2k-three-image-kl}/rollouts
