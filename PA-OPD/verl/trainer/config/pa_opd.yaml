# PA-OPD: Qwen3-VL-8B, four-GPU training recipe.
# Runtime paths are supplied by scripts/run_pa_opd.sh through PA_OPD_* variables.
defaults:
  - ppo_trainer
  - user
  - _self_

hydra:
  job:
    chdir: false
  output_subdir: null

max_model_len: 10240

# Some environments set this globally for TP rollouts. PA-OPD uses four
# one-GPU FSDP actors, so Ray must narrow CUDA_VISIBLE_DEVICES independently
# for every actor. An empty value deliberately overrides any inherited flag.
ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES: ""

actor_rollout_ref:
  model:
    path: ${oc.env:PA_OPD_MODEL_PATH,}
    trust_remote_code: true
    # The prebuilt training venv has no importable FlashAttention2 extension.
    # Use PyTorch SDPA for FSDP actor/teacher initialization.
    override_config:
      attn_implementation: sdpa
    # SDPA path: remove-padding calls flash_attn.bert_padding, unavailable in the requested venv.
    use_remove_padding: false
    enable_gradient_checkpointing: true
    custom_chat_template_file: ${oc.env:PA_OPD_CHAT_TEMPLATE_FILE,chat_templates/perception_chat_template_qwen3vl.jinja}

  actor:
    ppo_mini_batch_size: 32
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 10240
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    use_kl_loss: false
    calculate_entropy: false
    optim:
      lr: 2.0e-6
      lr_warmup_steps: 10
    fsdp_config:
      param_offload: true
      optimizer_offload: true
    policy_loss:
      loss_mode: vopd
    self_distillation:
      full_logit_distillation: true
      distillation_topk: 100
      alpha: 0.5
      is_clip: 2.0
      max_reprompt_len: 10240
      dont_reprompt_on_self_success: true
      include_environment_feedback: false
      teacher_always_on: true
      teacher_model_source: legacy
      teacher_regularization: ema
      teacher_update_rate: 0.05
      teacher_image_key: bbox_images
      teacher_input_mode: global_plus_crop
      contrastive_visual_advantage: false
      pa_opd_enabled: true
      pa_opd_option_labels: [A, B, C, D]
      pa_opd_format_rlvr_coef: 0.1

  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

  rollout:
    name: vllm
    n: 8
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.7
    log_prob_micro_batch_size_per_gpu: 1
    max_num_batched_tokens: 10240
    max_model_len: 10240
    response_length: 2048
    calculate_log_probs: true
    agent:
      num_workers: 4
    engine_kwargs:
      vllm:
        compilation_config:
          pass_config:
            fuse_allreduce_rms: false
        kernel_config:
          enable_flashinfer_autotune: false

data:
  train_files:
    - ${oc.env:PA_OPD_TRAIN_FILE,}
  val_files: []
  filter_overlong_prompts: false
  max_prompt_length: 8192
  max_response_length: 2048
  truncation: error
  shuffle: true
  trust_remote_code: true
  return_multi_modal_inputs: true
  image_key: images
  pa_opd_raw_jsonl: true
  train_batch_size: 32
  dataloader_num_workers: 8
  apply_chat_template_kwargs:
    enable_thinking: true

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

critic:
  model:
    path: ${actor_rollout_ref.model.path}

reward_model:
  enable: false
  use_reward_loop: false

custom_reward_function:
  path: ${oc.env:PA_OPD_ROOT,.}/verl/utils/reward_score/pa_opd_format.py
  name: compute_score

trainer:
  project_name: pa-opd
  group_name: pa-opd-qwen3-vl-8b
  experiment_name: ${oc.env:PA_OPD_RUN_NAME,pa-opd-qwen3-vl-8b-4gpu}
  logger: [console, wandb]
  n_gpus_per_node: 4
  nnodes: 1
  # Save every ten optimizer updates so an interruption can resume from the
  # latest student + EMA-teacher FSDP state.
  save_freq: 10
  # Keep false for actual training. A smoke run may override this to validate
  # rollout and optimizer behavior without writing another full FSDP checkpoint.
  skip_checkpoint: false
  test_freq: -1
  # Keep the latest two full distributed checkpoints. This leaves one known-good
  # checkpoint available while the next one is being written.
  max_actor_ckpt_to_keep: 2
  resume_mode: auto
  resume_from_path: null
  total_epochs: 1
  val_before_train: false
  default_local_dir: ${oc.env:PA_OPD_WORK_DIR,outputs/pa-opd-qwen3-vl-8b-4gpu}/checkpoints
  rollout_data_dir: ${oc.env:PA_OPD_WORK_DIR,outputs/pa-opd-qwen3-vl-8b-4gpu}/rollouts
